# SCRUM-XX: samodejna objava Docker slik na Docker Hub
#
# Zazene se po uspesni izvedbi CI workflowa (ci.yml) na main veji.
# Gradi in objavi:
#   - timotejzavski/rai-backend
#   - timotejzavski/sap-backup
#
# Potrebni GitHub secrets (set v repo → Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME  -- Docker Hub uporabnisko ime
#   DOCKER_PASSWORD  -- Docker Hub access token (ali geslo)
#
# Roco: ce zelis objavljati samo ob tagih (npr. v1.0.0), zamenjaj
# trigger na:
#   on:
#     push:
#       tags: [ "v*" ]

name: Publish Docker images

on:
  workflow_run:
    workflows: ["Project CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: docker.io
  # Spremeni "smart-playgrounds" v svoj Docker Hub namespace.
  IMAGE_NAMESPACE: timotejzavski

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: d_deploy
    # Objavi samo ce je CI uspel (in ce je bil push na main,
    # ne na PR, ki ga workflow_run ze filtrira po branchu).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Preveri commit, ki je sprozil CI workflow
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_commit.id }}"
          SHORT_SHA="${SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          if [ -z "$DOCKER_USER" ]; then
            echo "::error::DOCKER_USERNAME is empty. Check the d_deploy environment secret."
            failed=1
          fi

          if [ -z "$DOCKER_PASS" ]; then
            echo "::error::DOCKER_PASSWORD is empty. Check the d_deploy environment secret."
            failed=1
          fi

          if [[ "$DOCKER_USER" == *[[:space:]]* ]]; then
            echo "::error::DOCKER_USERNAME contains whitespace. It must be the exact Docker Hub username, for example timotejzavski."
            failed=1
          fi

          if [[ "$DOCKER_PASS" == *[[:space:]]* ]]; then
            echo "::error::DOCKER_PASSWORD contains whitespace/newlines. Paste only the Docker Hub access token value, without quotes or line breaks."
            failed=1
          fi

          case "$DOCKER_USER" in
            \"*|*\"|\'*|*\')
              echo "::error::DOCKER_USERNAME appears to include quote characters. Remove quotes from the GitHub secret value."
              failed=1
              ;;
          esac

          case "$DOCKER_PASS" in
            \"*|*\"|\'*|*\')
              echo "::error::DOCKER_PASSWORD appears to include quote characters. Remove quotes from the GitHub secret value."
              failed=1
              ;;
          esac

          echo "Docker username length: ${#DOCKER_USER}"
          echo "Docker token length: ${#DOCKER_PASS}"

          exit "$failed"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------
      # RAI backend
      # --------------------------------------------------
      - name: Build and push rai-backend
        shell: bash
        run: |
          SHORT_SHA="${{ steps.tags.outputs.short_sha }}"
          docker build \
            -t "${{ env.IMAGE_NAMESPACE }}/rai-backend:latest" \
            -t "${{ env.IMAGE_NAMESPACE }}/rai-backend:${SHORT_SHA}" \
            -f RAI/server/Dockerfile RAI/server
          docker push "${{ env.IMAGE_NAMESPACE }}/rai-backend:latest"
          docker push "${{ env.IMAGE_NAMESPACE }}/rai-backend:${SHORT_SHA}"

      # --------------------------------------------------
      # SA backup
      # --------------------------------------------------
      - name: Build and push sap-backup
        shell: bash
        run: |
          SHORT_SHA="${{ steps.tags.outputs.short_sha }}"
          docker build \
            -t "${{ env.IMAGE_NAMESPACE }}/sap-backup:latest" \
            -t "${{ env.IMAGE_NAMESPACE }}/sap-backup:${SHORT_SHA}" \
            -f SA/backup/Dockerfile SA/backup
          docker push "${{ env.IMAGE_NAMESPACE }}/sap-backup:latest"
          docker push "${{ env.IMAGE_NAMESPACE }}/sap-backup:${SHORT_SHA}"

      # --------------------------------------------------
      # Koncni status
      # --------------------------------------------------
      - name: Summary
        shell: bash
        run: |
          echo "## Objavljene slike" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAMESPACE }}/rai-backend:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAMESPACE }}/rai-backend:${{ steps.tags.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAMESPACE }}/sap-backup:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_NAMESPACE }}/sap-backup:${{ steps.tags.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
