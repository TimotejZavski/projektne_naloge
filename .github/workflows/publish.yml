# SCRUM-XX: samodejna objava Docker slik na Docker Hub
#
# Zazene se po uspesni izvedbi CI workflowa (ci.yml) na main veji.
# Gradi in objavi:
#   - timotejzavski/rai-backend
#   - timotejzavski/sap-backup
#
# Potrebni GitHub secrets (set v repo → Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME  -- Docker Hub uporabnisko ime
#   DOCKER_PASSWORD  -- Docker Hub access token (ali geslo)
#
# Roco: ce zelis objavljati samo ob tagih (npr. v1.0.0), zamenjaj
# trigger na:
#   on:
#     push:
#       tags: [ "v*" ]

name: Publish Docker images

on:
  workflow_run:
    workflows: ["Project CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: docker.io
  # Spremeni "smart-playgrounds" v svoj Docker Hub namespace.
  IMAGE_NAMESPACE: timotejzavski

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    environment: d_deploy
    # Objavi samo ce je CI uspel (in ce je bil push na main,
    # ne na PR, ki ga workflow_run ze filtrira po branchu).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Preveri commit, ki je sprozil CI workflow
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_commit.id }}"
          SHORT_SHA="${SHA:0:7}"
          NS="${{ env.IMAGE_NAMESPACE }}"
          echo "rai_tags=$NS/rai-backend:latest,$NS/rai-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backup_tags=$NS/sap-backup:latest,$NS/sap-backup:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Diagnostic - verify secrets
        shell: bash
        run: |
          echo "Username length: ${#DOCKER_USER}"
          echo "Password length: ${#DOCKER_PASS}"
          echo "Username first 3 chars: ${DOCKER_USER:0:3}"
          echo "Password starts with: ${DOCKER_PASS:0:8}"
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        run: |
          printf '%s' "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------
      # RAI backend
      # --------------------------------------------------
      - name: Build and push rai-backend
        shell: bash
        run: |
          docker build -t ${{ steps.tags.outputs.rai_tags }} -f RAI/server/Dockerfile RAI/server
          docker push --all-tags ${{ env.IMAGE_NAMESPACE }}/rai-backend

      # --------------------------------------------------
      # SA backup
      # --------------------------------------------------
      - name: Build and push sap-backup
        shell: bash
        run: |
          docker build -t ${{ steps.tags.outputs.backup_tags }} -f SA/backup/Dockerfile SA/backup
          docker push --all-tags ${{ env.IMAGE_NAMESPACE }}/sap-backup

      # --------------------------------------------------
      # Koncni status
      # --------------------------------------------------
      - name: Summary
        shell: bash
        run: |
          echo "## Objavljene slike" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.rai_tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.backup_tags }}\`" >> "$GITHUB_STEP_SUMMARY"
