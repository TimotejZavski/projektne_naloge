# SCRUM-XX: samodejna objava Docker slik na Docker Hub
#
# Zazene se po uspesni izvedbi CI workflowa (ci.yml) na main veji.
# Gradi in objavi:
#   - smart-playgrounds/rai-backend
#   - smart-playgrounds/sap-backup
#
# Potrebni GitHub secrets (set v repo → Settings → Secrets and variables → Actions):
#   DOCKER_USERNAME  -- Docker Hub uporabnisko ime
#   DOCKER_PASSWORD  -- Docker Hub access token (ali geslo)
#
# Roco: ce zelis objavljati samo ob tagih (npr. v1.0.0), zamenjaj
# trigger na:
#   on:
#     push:
#       tags: [ "v*" ]

name: Publish Docker images

on:
  workflow_run:
    workflows: ["Project CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: docker.io
  # Spremeni "smart-playgrounds" v svoj Docker Hub namespace.
  IMAGE_NAMESPACE: smart-playgrounds

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    # Objavi samo ce je CI uspel (in ce je bil push na main,
    # ne na PR, ki ga workflow_run ze filtrira po branchu).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Preveri commit, ki je sprozil CI workflow
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_commit.id }}"
          SHORT_SHA="${SHA:0:7}"
          NS="${{ env.IMAGE_NAMESPACE }}"
          echo "rai_tags=$NS/rai-backend:latest,$NS/rai-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "backup_tags=$NS/sap-backup:latest,$NS/sap-backup:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------------------
      # RAI backend
      # --------------------------------------------------
      - name: Build and push rai-backend
        uses: docker/build-push-action@v6
        with:
          context: RAI/server
          file: RAI/server/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.rai_tags }}

      # --------------------------------------------------
      # SA backup
      # --------------------------------------------------
      - name: Build and push sap-backup
        uses: docker/build-push-action@v6
        with:
          context: SA/backup
          file: SA/backup/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backup_tags }}

      # --------------------------------------------------
      # Koncni status
      # --------------------------------------------------
      - name: Summary
        shell: bash
        run: |
          echo "## Objavljene slike" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.rai_tags }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.backup_tags }}\`" >> "$GITHUB_STEP_SUMMARY"
