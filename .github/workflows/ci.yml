name: Project CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "SCRUM-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rai-server:
    name: RAI server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAI/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RAI/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test
