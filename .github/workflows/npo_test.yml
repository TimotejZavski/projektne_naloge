name: Test NPO builds

on:
  push:
    paths:
      - 'NPO/**'
      - '.github/workflows/npo_test.yml'
  pull_request:
    paths:
      - 'NPO/**'
      - '.github/workflows/npo_test.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android build on self-hosted Pi
    runs-on: [self-hosted, Linux, ARM64]
    env:
      DOTNET_INSTALL_DIR: /home/raca/.dotnet
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.420'
          global-json-file: global.json
      - name: Show .NET info
        run: dotnet --info
      - name: Install MAUI android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Restore
        run: dotnet restore NPO/NPO-Aplikacija/NPO-Aplikacija.csproj
      - name: Build Android
        run: dotnet build NPO/NPO-Aplikacija/NPO-Aplikacija.csproj -f net8.0-android -c Release



