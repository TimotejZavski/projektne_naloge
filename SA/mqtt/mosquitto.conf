# Mosquitto MQTT broker - konfiguracija
# Projekt: Smart Playgrounds
# Naloga: SCRUM-14 (MQTT streznik setup - Mosquitto + topics)

# ----------------------------------------------------------------------
# Listenerji
# ----------------------------------------------------------------------
# Primarni MQTT listener za mobilne naprave in backend storitev.
listener 1883 0.0.0.0
protocol mqtt

# Sekundarni WebSocket listener za morebitne brskalniske kliente
# (npr. real-time prikaz v spletni aplikaciji brez posrednika).
listener 9001 0.0.0.0
protocol websockets

# ----------------------------------------------------------------------
# Avtentikacija
# ----------------------------------------------------------------------
# Razvojno okolje: dovoljeni anonimni klienti.
# Pred produkcijo:
#   1. allow_anonymous false
#   2. password_file /mosquitto/config/passwd
#   3. dodati uporabnike z ukazom: mosquitto_passwd -c passwd <user>
allow_anonymous true

# ----------------------------------------------------------------------
# Persistenca
# ----------------------------------------------------------------------
# Hranimo stanje sej (subscriptions, queued messages) preko ponovnih zagonov.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# ----------------------------------------------------------------------
# Beleženje
# ----------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true

# ----------------------------------------------------------------------
# Limiti in zmogljivost
# ----------------------------------------------------------------------
max_connections -1
max_keepalive 65535
max_queued_messages 1000
message_size_limit 0

# Klienti s persistent sejo (clean_session=false) se cez 7 dni neaktivnosti odstranijo.
persistent_client_expiration 7d
